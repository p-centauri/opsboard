name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: make setup
      - name: Lint and type check
        run: make lint
      - name: Tests
        run: make test
      - name: Prod image builds
        run: docker build --target prod -t opsboard-api:ci api
      - name: Stop containers
        if: always()
        run: docker compose down -v
