name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build dev images and install web deps
        run: make setup
      - name: Lint and type check (API + web)
        run: make lint
      - name: Unit and integration tests (API + web)
        run: make test
      - name: Seed demo data
        run: make seed
      - name: Browser and accessibility tests
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
      - name: Production images build
        run: docker compose -f docker-compose.yml build
      - name: Stop containers
        if: always()
        run: docker compose --profile e2e down -v
