# Production-like stack. `docker compose` also loads docker-compose.override.yml (dev:
# reload, bind mounts, test tools); `make run` uses this file alone.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: opsboard-api:prod
    build:
      context: ./api
      target: prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Trust X-Forwarded-For from inside this network: it is set by the edge proxy (Caddy) from
      # the real connection. web and api must never be reachable from outside except via edge.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: opsboard-web:prod
    build:
      context: ./web
      target: prod
      args:
        API_URL: http://api:8000
    environment:
      API_URL: http://api:8000
      # Shows one-click demo sign-in buttons. Leave empty outside the public demo.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    # No published port: browsers reach the app only through `edge`.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40

  edge:
    image: caddy:2.10.2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
